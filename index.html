<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roast My Landing Page - Desktop V1 Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./app.js?v=20260228b"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById("app");
        if (!root || root.children.length > 0 || (root.textContent || "").trim().length > 0) return;
        root.innerHTML =
          '<div style="max-width:960px;margin:40px auto;padding:24px;border:1px solid #dccfbd;border-radius:16px;background:#fffaf2;color:#191614;font-family:Avenir Next,Segoe UI,sans-serif;">' +
          '<div style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6f665f;margin-bottom:8px;">Frontend Watchdog</div>' +
          '<h1 style="margin:0 0 12px;font-size:32px;line-height:1.1;">App did not mount</h1>' +
          '<p style="margin:0 0 12px;line-height:1.5;">`index.html` loaded, but `app.js` did not render content into <code>#app</code>.</p>' +
          '<p style="margin:0;line-height:1.5;">Likely causes: stale browser cache, `app.js` not loading, or a runtime error before mount.</p>' +
          "</div>";
      }, 1200);
    </script>
  </body>
  </html>
